# ─────────────────────────────────────────────────────────────────────────────
# 只跑一次：从头编译 CeGCC(arm-mingw32ce) 交叉工具链，发布成 Release 资产。
# CeGCC 没有官方预编译包，所以我们必须自己编一个。
# 编完之后的每次应用构建都直接下载它（约 1 分钟）。
# ─────────────────────────────────────────────────────────────────────────────
name: 1. Build CeGCC toolchain (ARM, run once)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/1-build-toolchain.yml'

permissions:
  contents: write

jobs:
  toolchain:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    env:
      SRC: ${{ github.workspace }}/../cegcc-src
      PREFIX: ${{ github.workspace }}/../cegcc-install/cegcc
      TARBALL: ${{ github.workspace }}/../cegcc-arm-mingw32ce.tar.gz

    steps:
      - name: 安装宿主构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bison flex texinfo \
            libgmp-dev libmpfr-dev libmpc-dev libisl-dev zlib1g-dev \
            ca-certificates git curl

      - name: 显示宿主环境
        run: |
          gcc --version | head -1
          make --version | head -1
          nproc

      # ── 首选：enlyze 分支（GCC 9.3.0，在较新的宿主上更容易编过）──────────
      - name: 克隆 enlyze/cegcc-build（含子模块）
        run: |
          git clone --recursive https://github.com/enlyze/cegcc-build.git "$SRC"
          cd "$SRC"
          git submodule update --init --recursive
          echo "── 子模块状态 ──"
          git submodule status

      - name: 编译 arm-mingw32ce 工具链（enlyze）
        id: build_enlyze
        continue-on-error: true
        run: |
          mkdir -p "$(dirname "$PREFIX")"
          cd "$SRC"
          ./build_cf.sh "$PREFIX" arm-mingw32ce

      # ── 回退：MaxKellermann 原版（ARM 默认目标）──────────────────────────
      - name: 回退到 MaxKellermann/cegcc-build
        if: steps.build_enlyze.outcome == 'failure'
        run: |
          echo "::warning::enlyze 构建失败，回退 MaxKellermann 原版"
          rm -rf "$SRC" "$PREFIX"
          git clone --recursive https://github.com/MaxKellermann/cegcc-build.git "$SRC"
          cd "$SRC"
          git submodule update --init --recursive
          mkdir -p "$(dirname "$PREFIX")"
          OUT="$SRC/../cegcc-out"
          rm -rf "$OUT"; mkdir -p "$OUT"; cd "$OUT"
          "$SRC/build.sh" --prefix="$PREFIX" --target=arm-mingw32ce

      # 自检改为「探测式且不阻塞」：
      # CeGCC 不认桌面 MinGW 的 -mwindows，必须找出正确的子系统设法。
      # 这一步只报告，绝不 return 非零 —— 工具链编出来了就必须打包发布，
      # 否则前面 15 分钟的编译白费（这是上一次失败的教训）。
      - name: 自检工具链（探测正确链接方式，只报告不阻塞）
        run: |
          set +e
          test -x "$PREFIX/bin/arm-mingw32ce-gcc" || { echo "编译器不存在"; ls -R "$PREFIX" | head -50; exit 1; }
          export PATH="$PREFIX/bin:$PATH"
          echo "── 编译器 ──"
          arm-mingw32ce-gcc --version | head -1
          echo
          echo "── 工具链自带的导入库（找 coredll / ws2）──"
          find "$PREFIX" -name 'libcoredll*' -o -name 'libws2*' -o -name 'libcrtdll*' 2>/dev/null | head -20
          echo
          echo "── 头文件目录 ──"
          ls -d "$PREFIX"/arm-mingw32ce/include 2>/dev/null && ls "$PREFIX"/arm-mingw32ce/include | head -15
          echo
          printf '#include <windows.h>\nint WINAPI WinMain(HINSTANCE a,HINSTANCE b,LPWSTR c,int d){return 0;}\n' > /tmp/t.c
          echo "── 逐个试链接方式，并检查产出的 PE 子系统是否 = 9(WINDOWS_CE_GUI) ──"
          n=0
          for FLAGS in "" "-Wl,--subsystem,windowsce" "-Wl,--subsystem,9" "-mwin32" "-mno-cygwin"; do
            n=$((n+1))
            echo "===== 方式$n  旗标: [$FLAGS] ====="
            rm -f /tmp/t$n.exe
            arm-mingw32ce-gcc $FLAGS -o /tmp/t$n.exe /tmp/t.c -lcoredll 2>&1 | head -6
            if [ -f /tmp/t$n.exe ]; then
              python3 scripts/checkpe.py /tmp/t$n.exe
            else
              echo "  ❌ 没产出可执行文件"
            fi
          done
          echo
          echo "===== 附加探测：能否链接 ws2（网络）====="
          printf '#include <winsock2.h>\nint WINAPI WinMain(HINSTANCE a,HINSTANCE b,LPWSTR c,int d){SOCKET s=socket(AF_INET,SOCK_STREAM,0);(void)s;return 0;}\n' > /tmp/w.c
          arm-mingw32ce-gcc -o /tmp/w.exe /tmp/w.c -lcoredll -lws2 2>&1 | head -8
          [ -f /tmp/w.exe ] && python3 scripts/checkpe.py /tmp/w.exe || echo "  ❌ ws2 链接失败"
          echo
          echo "（自检结束 —— 无论结果如何都继续打包）"
          exit 0

      - name: 打包
        run: |
          cd "$(dirname "$PREFIX")"
          tar czf "$TARBALL" "$(basename "$PREFIX")"
          ls -lh "$TARBALL"

      - name: 发布 Release 资产
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view cegcc-arm >/dev/null 2>&1 \
            || gh release create cegcc-arm --title "CeGCC ARM toolchain" \
                 --notes "CeGCC arm-mingw32ce 交叉工具链（CI 自编）。应用构建直接下载此资产。"
          gh release upload cegcc-arm "$TARBALL" --clobber
