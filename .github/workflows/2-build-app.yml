# ─────────────────────────────────────────────────────────────────────────────
# 每次 push 自动构建车机程序。
# 前置条件：先跑过 1-build-toolchain，Releases 里有 cegcc-arm。
# ─────────────────────────────────────────────────────────────────────────────
name: 2. Build WinCE app

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 下载 CeGCC 工具链
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download cegcc-arm \
            --pattern 'cegcc-arm-mingw32ce.tar.gz' \
            --dir "$RUNNER_TEMP" --clobber
          mkdir -p "$HOME/tc"
          tar xzf "$RUNNER_TEMP/cegcc-arm-mingw32ce.tar.gz" -C "$HOME/tc"
          echo "── 工具链内容 ──"
          ls "$HOME/tc"
          test -x "$HOME/tc/cegcc/bin/arm-mingw32ce-gcc"

      - name: 编译
        run: |
          export PATH="$HOME/tc/cegcc/bin:$PATH"
          make check
          make

      - name: 校验产物是 WinCE ARM PE
        run: |
          python3 - <<'PY'
          import struct, sys, glob
          f = glob.glob('build/*.exe')
          if not f: sys.exit('没有产物')
          f = f[0]
          d = open(f,'rb').read()
          pe = struct.unpack_from('<I', d, 0x3c)[0]
          assert d[pe:pe+4] == b'PE\0\0', '不是 PE 文件'
          mach, nsec = struct.unpack_from('<HH', d, pe+4)
          magic = struct.unpack_from('<H', d, pe+24)[0]
          subsys = struct.unpack_from('<H', d, pe+24+68)[0]
          print(f'{f}: {len(d)} 字节  Machine=0x{mach:04x}  Magic=0x{magic:x}  节={nsec}  Subsystem={subsys}')
          assert mach == 0x01c2, f'Machine 应为 0x01c2(ARM)，实际 0x{mach:04x}'
          assert magic == 0x10b,  f'应为 PE32(0x10b)，实际 0x{magic:x}'
          assert subsys == 9,     f'Subsystem 应为 9(WINDOWS_CE_GUI)，实际 {subsys}'
          print('✅ WinCE 6.0 ARM GUI 程序校验通过')
          PY

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: wince-exe
          path: build/*.exe
          if-no-files-found: error
