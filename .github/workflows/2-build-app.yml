# ─────────────────────────────────────────────────────────────────────────────
# 每次 push 自动构建车机程序。
# 前置条件：先跑过 1-build-toolchain，Releases 里有 cegcc-arm。
# ─────────────────────────────────────────────────────────────────────────────
name: 2. Build WinCE app

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 下载 CeGCC 工具链
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download cegcc-arm \
            --pattern 'cegcc-arm-mingw32ce.tar.gz' \
            --dir "$RUNNER_TEMP" --clobber
          mkdir -p "$HOME/tc"
          tar xzf "$RUNNER_TEMP/cegcc-arm-mingw32ce.tar.gz" -C "$HOME/tc"
          echo "── 工具链内容 ──"
          ls "$HOME/tc"
          test -x "$HOME/tc/cegcc/bin/arm-mingw32ce-gcc"

      # 一次性探测出「子系统旗标」和「库名」两件事，写进环境变量。
      # 这样换工具链版本、旗标或库名变了，构建都能自愈，不用再废一轮编译。
      - name: 探测可用的子系统旗标与库名
        run: |
          export PATH="$HOME/tc/cegcc/bin:$PATH"
          echo "── 工具链里和 coredll / ws2 有关的库与头 ──"
          find "$HOME/tc" \( -name 'libcoredll*' -o -name 'libws2*' -o -name 'coredll.def' \) 2>/dev/null | head -10
          echo

          printf '#include <windows.h>\nint WINAPI WinMain(HINSTANCE a,HINSTANCE b,LPWSTR c,int d){return 0;}\n' > /tmp/gui.c
          printf '#include <winsock2.h>\nint WINAPI WinMain(HINSTANCE a,HINSTANCE b,LPWSTR c,int d){SOCKET s=socket(AF_INET,SOCK_STREAM,0);(void)s;return 0;}\n' > /tmp/net.c

          SUBSYS=""; LIBS=""; NETLIBS=""
          # 第一层：找能产出合法 WinCE PE 的子系统旗标 + coredll 设法
          for F in "-Wl,--subsystem,windowsce" "" "-Wl,--subsystem,9" "-mwindows"; do
            for L in "-lcoredll" "" "-lcrtdll"; do
              rm -f /tmp/gui.exe
              if arm-mingw32ce-gcc $F -o /tmp/gui.exe /tmp/gui.c $L >/dev/null 2>&1 \
                 && python3 scripts/checkpe.py /tmp/gui.exe --quiet; then
                SUBSYS="$F"; LIBS="$L"
                echo "✅ GUI 可用: 旗标=[$F]  库=[$L]"
                break 2
              fi
            done
          done
          if [ -z "$LIBS" ] && [ "$SUBSYS" != "" ]; then :; fi
          if ! python3 scripts/checkpe.py /tmp/gui.exe --quiet 2>/dev/null; then
            echo "❌ 没有任何组合能产出合法 WinCE PE —— 把上面工具链里能找到的库贴给我"
            find "$HOME/tc" -name '*.a' 2>/dev/null | head -40
            exit 1
          fi
          python3 scripts/checkpe.py /tmp/gui.exe

          # 第二层：在 GUI 可用的前提下追加找网络库
          for N in "-lws2" "-lwsock32" "-lws2_32" ""; do
            rm -f /tmp/net.exe
            if arm-mingw32ce-gcc $SUBSYS -o /tmp/net.exe /tmp/net.c $LIBS $N >/dev/null 2>&1; then
              NETLIBS="$N"
              echo "✅ 网络库可用: [$N]"
              break
            fi
          done
          if [ -z "$NETLIBS" ] && ! arm-mingw32ce-gcc $SUBSYS -o /tmp/net.exe /tmp/net.c $LIBS >/dev/null 2>&1; then
            echo "⚠ 找不到可用的网络库，探测工具与客户端会编译失败（主程序不受影响）"
          fi

          echo "WINCE_LDFLAGS=$SUBSYS" >> "$GITHUB_ENV"
          echo "WINCE_CORELIB=$LIBS"   >> "$GITHUB_ENV"
          echo "WINCE_NETLIB=$NETLIBS" >> "$GITHUB_ENV"
          echo
          echo "最终选定: 旗标=[$SUBSYS]  核心库=[$LIBS]  网络库=[$NETLIBS]"

      # ── 协议规格核对 ──
      # 用 Baidu 官方仓库里的 .proto 文件核对我们的编码，
      # 以及核对消息 ID / 包头长度。之前所有验证都是"代码是否符合我的理解"，
      # 这一步是拿权威规格来核对代码。
      - name: 源码静态自查（函数声明顺序等）
        run: |
          python3 scripts/check_order.py

      - name: 核对协议编码与官方规格
        run: |
          python3 scripts/check_proto.py

      # ── 协议实现的端到端验证 ──
      # 用主机编译器编出【真实的 carlife.c】，连上 Python 起的"假手机"，
      # 把它发出的每个包逐字节拆开核对。
      # 字节序/包头/字段号/时序这类错误读代码看不出来，跑一遍就现形 ——
      # 而这些错等去车上才发现，代价是一整趟车程。
      - name: 协议实现端到端验证（真实代码 + 假手机）
        run: |
          python3 scripts/protocol_test.py

      # ── JPEG 解码器验证 ──
      # 分两步：① 主机上跑通证明算法正确 ② 能为 ARM 编译
      # 之所以要在主机跑：我们的产物是 ARM WinCE PE，跑不进 CI 的 x86 机器。
      - name: 验证 RSA 签名（ADB 认证用，主机签名 + Python 独立验签）
        run: |
          python3 scripts/rsa_test.py

      - name: 验证 RSA 模块能为 ARM/WinCE 编译
        run: |
          export PATH="$HOME/tc/cegcc/bin:$PATH"
          arm-mingw32ce-gcc -Os -Wall -c src/rsa.c -o /tmp/rsa_arm.o
          ls -l /tmp/rsa_arm.o
          echo "✅ rsa 模块能为 ARM/WinCE 编译（无平台耦合）"

      - name: 验证 ADB 协议（真实代码 + 假 adbd，含 RSA 认证验签）
        run: |
          python3 scripts/adb_test.py

      - name: 验证 ADB 模块能为 ARM/WinCE 编译
        run: |
          export PATH="$HOME/tc/cegcc/bin:$PATH"
          arm-mingw32ce-gcc -Os -Wall -c src/adb.c -o /tmp/adb_arm.o
          ls -l /tmp/adb_arm.o
          echo "✅ adb 模块能为 ARM/WinCE 编译（无平台耦合）"

      - name: 编译完整的 ADB 转发栈为 ARM（设备读写 + 转发器）
        run: |
          export PATH="$HOME/tc/cegcc/bin:$PATH"
          for f in rsa adb adbio_ce adbproxy; do
            arm-mingw32ce-gcc -Os -Wall -DUNICODE -D_UNICODE -Isrc -c src/$f.c -o /tmp/$f.o
            echo "  ✅ src/$f.c 编译通过"
          done
          # 链接一遍，确认符号齐全（用 viewer 的对象一起链，能提前发现缺函数）
          ls -l /tmp/rsa.o /tmp/adb.o /tmp/adbio_ce.o /tmp/adbproxy.o

      - name: 验证 ADB 端口转发器（真实转发器代码 + 假手机，端到端）
        run: |
          python3 scripts/adbproxy_test.py

      - name: 验证画面呈现层（像素格式 + 铺屏参数 + 触摸换算）
        run: |
          gcc -O1 -g -Wall -DDISP_HOST_TEST -Ihost -Isrc \
              -o /tmp/test_display host/test_display.c src/display.c
          /tmp/test_display

      - name: 全链路集成验证（假手机 → 假 adbd → 转发器 → CarLife 客户端 → 解码）
        run: |
          python3 scripts/integration_test.py

      - name: 验证 JPEG 解码器（主机运行 + 断言像素值）
        run: |
          python3 scripts/make_test_jpeg.py /tmp/test_gray.jpg
          gcc -O2 -Wall -o /tmp/test_nj src/third_party/test_nanojpeg.c
          /tmp/test_nj /tmp/test_gray.jpg

      - name: 验证 JPEG 解码器能为 ARM 编译
        run: |
          export PATH="$HOME/tc/cegcc/bin:$PATH"
          arm-mingw32ce-gcc -Os -Wall -c src/third_party/nanojpeg.c -o /tmp/nj_arm.o
          ls -l /tmp/nj_arm.o
          echo "✅ nanojpeg 能为 ARM/WinCE 编译"

      # 主程序必须编过 —— 这是本次交付的底线
      - name: 编译主程序
        run: |
          export PATH="$HOME/tc/cegcc/bin:$PATH"
          make check
          make main LDFLAGS="$WINCE_LDFLAGS -s" CORELIB="$WINCE_CORELIB"

      # 探测工具是加分项：链接 -lws2 若失败（工具链没带这个导入库），
      # 不应拖垮主程序，所以 continue-on-error + 打印真实报错供诊断。
      - name: 编译网络探测工具（失败不阻塞交付）
        continue-on-error: true
        run: |
          export PATH="$HOME/tc/cegcc/bin:$PATH"
          echo "── 查找 ws2 导入库 ──"
          find "$HOME/tc" -name 'libws2*' -o -name 'ws2*def' 2>/dev/null | head
          make probe LDFLAGS="$WINCE_LDFLAGS -s" CORELIB="$WINCE_CORELIB" NETLIB="$WINCE_NETLIB"

      # 客户端同样属于加分项，但它的编译错误最有诊断价值（协议层首次编译）
      - name: 编译主客户端（失败不阻塞交付）
        continue-on-error: true
        run: |
          export PATH="$HOME/tc/cegcc/bin:$PATH"
          make client LDFLAGS="$WINCE_LDFLAGS -s" CORELIB="$WINCE_CORELIB" NETLIB="$WINCE_NETLIB"

      # 直接调用统一脚本，不再在这里另写一份检查逻辑。
      # 教训：之前这里内联了一份 assert Machine==0x01c2，改了 scripts/checkpe.py
      # 却忘了同步改这里，导致三个程序明明编出来了却卡在校验。
      - name: 校验产物是 WinCE ARM PE
        run: |
          fail=0
          for f in build/*.exe; do
            python3 scripts/checkpe.py "$f" || fail=1
          done
          if [ $fail -ne 0 ]; then
            echo "❌ 有产物不是合法的 WinCE ARM GUI 程序"
            exit 1
          fi
          echo "✅ 全部产物通过 WinCE 6.0 ARM GUI 校验"

      # ⭐ 最终程序：显示 + 触摸回传。这是本次交付的核心，必须编过。
      - name: 编译最终程序（显示 + 触摸回传）
        run: |
          export PATH="$HOME/tc/cegcc/bin:$PATH"
          make viewer LDFLAGS="$WINCE_LDFLAGS -s" CORELIB="$WINCE_CORELIB" NETLIB="$WINCE_NETLIB"

      # 检查导入的 DLL：CeGCC 若把 GCC 运行库做成 DLL 依赖，
      # 车机上没有就会「一点就闪退」，必须出发前发现。
      - name: 检查导入的 DLL（防车机闪退）
        run: |
          for f in build/*.exe; do
            python3 scripts/checkimports.py "$f" || true
          done

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wince-exe
          path: build/*.exe
          if-no-files-found: error
