# ─────────────────────────────────────────────────────────────────────────────
# 每次 push 自动构建车机程序。
# 前置条件：先跑过 1-build-toolchain，Releases 里有 cegcc-arm。
# ─────────────────────────────────────────────────────────────────────────────
name: 2. Build WinCE app

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 下载 CeGCC 工具链
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download cegcc-arm \
            --pattern 'cegcc-arm-mingw32ce.tar.gz' \
            --dir "$RUNNER_TEMP" --clobber
          mkdir -p "$HOME/tc"
          tar xzf "$RUNNER_TEMP/cegcc-arm-mingw32ce.tar.gz" -C "$HOME/tc"
          echo "── 工具链内容 ──"
          ls "$HOME/tc"
          test -x "$HOME/tc/cegcc/bin/arm-mingw32ce-gcc"

      # 先探测哪种链接方式能产出合法 WinCE PE，写进环境变量供后面用。
      # 这样即使工具链换版本、旗标变了，构建也能自愈。
      - name: 探测可用的链接方式
        run: |
          export PATH="$HOME/tc/cegcc/bin:$PATH"
          printf '#include <windows.h>\nint WINAPI WinMain(HINSTANCE a,HINSTANCE b,LPWSTR c,int d){return 0;}\n' > /tmp/probe.c
          for F in "-Wl,--subsystem,windowsce" "" "-Wl,--subsystem,9" "-mwindows"; do
            rm -f /tmp/probe.exe
            if arm-mingw32ce-gcc $F -o /tmp/probe.exe /tmp/probe.c -lcoredll >/dev/null 2>&1 \
               && python3 scripts/checkpe.py /tmp/probe.exe --quiet; then
              echo "选定链接旗标: [$F]"
              echo "WINCE_LDFLAGS=$F" >> "$GITHUB_ENV"
              python3 scripts/checkpe.py /tmp/probe.exe
              exit 0
            fi
            echo "  ✗ [$F] 不可用"
          done
          echo "❌ 没有任何链接方式能产出合法 WinCE PE"
          exit 1

      # 主程序必须编过 —— 这是本次交付的底线
      - name: 编译主程序
        run: |
          export PATH="$HOME/tc/cegcc/bin:$PATH"
          make check
          make main LDFLAGS="$WINCE_LDFLAGS -s"

      # 探测工具是加分项：链接 -lws2 若失败（工具链没带这个导入库），
      # 不应拖垮主程序，所以 continue-on-error + 打印真实报错供诊断。
      - name: 编译网络探测工具（失败不阻塞交付）
        continue-on-error: true
        run: |
          export PATH="$HOME/tc/cegcc/bin:$PATH"
          echo "── 查找 ws2 导入库 ──"
          find "$HOME/tc" -name 'libws2*' -o -name 'ws2*def' 2>/dev/null | head
          make probe LDFLAGS="$WINCE_LDFLAGS -s"

      # 客户端同样属于加分项，但它的编译错误最有诊断价值（协议层首次编译）
      - name: 编译主客户端（失败不阻塞交付）
        continue-on-error: true
        run: |
          export PATH="$HOME/tc/cegcc/bin:$PATH"
          make client LDFLAGS="$WINCE_LDFLAGS -s"

      - name: 校验产物是 WinCE ARM PE
        run: |
          python3 - <<'PY'
          import struct, sys, glob
          files = sorted(glob.glob('build/*.exe'))
          if not files:
              sys.exit('没有产物')
          for f in files:
              d = open(f, 'rb').read()
              pe = struct.unpack_from('<I', d, 0x3c)[0]
              assert d[pe:pe+4] == b'PE\0\0', f'{f} 不是 PE 文件'
              mach, nsec = struct.unpack_from('<HH', d, pe+4)
              magic  = struct.unpack_from('<H', d, pe+24)[0]
              subsys = struct.unpack_from('<H', d, pe+24+68)[0]
              print(f'{f}: {len(d)} 字节  Machine=0x{mach:04x}  Magic=0x{magic:x}  '
                    f'节={nsec}  Subsystem={subsys}')
              assert mach   == 0x01c2, f'{f}: Machine 应为 0x01c2(ARM)，实际 0x{mach:04x}'
              assert magic  == 0x10b,  f'{f}: 应为 PE32(0x10b)，实际 0x{magic:x}'
              assert subsys == 9,      f'{f}: Subsystem 应为 9(WINDOWS_CE_GUI)，实际 {subsys}'
          print(f'✅ {len(files)} 个产物全部通过 WinCE 6.0 ARM GUI 校验')
          PY

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: wince-exe
          path: build/*.exe
          if-no-files-found: error
